# Cloud Build pipeline for AgentSchmidt with Cloud Deploy
# Triggers on push to main — deploys services with user-authenticated access.

substitutions:
  _REGION: 'europe-west1'
  _ALLOWED_USER: 'user:sebastian.alxr@gmail.com'

steps:
# 1. Apply Cloud Deploy pipeline and target
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'apply-clouddeploy'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud deploy apply --file=clouddeploy.yaml --project=$PROJECT_ID --region=$_REGION

# 2. Ensure GCS bucket, sync config and prepare Pub/Sub topic
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'setup-infra-and-config'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      # 1. Bucket sicherstellen
      gcloud storage buckets describe gs://agentschmidt-hermes-data-$PROJECT_NUMBER >/dev/null 2>&1 || \
      gcloud storage buckets create gs://agentschmidt-hermes-data-$PROJECT_NUMBER \
        --project=$PROJECT_ID \
        --location=$_REGION

      # 2. Config per GitOps in den Bucket synchronisieren
      if [ -f "config/config.yaml" ]; then
        gcloud storage cp config/config.yaml gs://agentschmidt-hermes-data-$PROJECT_NUMBER/config.yaml
      fi

      # 3. Pub/Sub Topic vorbereiten
      gcloud pubsub topics describe agentschmidt-hermes-inbound >/dev/null 2>&1 || \
      gcloud pubsub topics create agentschmidt-hermes-inbound --project=$PROJECT_ID

# 3. Create a release from the current source
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'create-release'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      release_name="release-${SHORT_SHA:-$BUILD_ID}"
      gcloud deploy releases create "$release_name" \
        --delivery-pipeline=agent-schmidt \
        --region=$_REGION \
        --source=. \
        --quiet

# 4. Wait for rollout to complete
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'wait-rollout'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      release_name="release-${SHORT_SHA:-$BUILD_ID}"
      gcloud deploy rollouts wait "$release_name" \
        --delivery-pipeline=agent-schmidt \
        --region=$_REGION \
        --timeout=600s \
        --quiet

# 5. All services: authenticated-only (user login required)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'configure-auth'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      for svc in agentschmidt-hermes; do
        gcloud run services update $svc \
          --region=$_REGION \
          --no-allow-unauthenticated \
          --quiet
        gcloud run services add-iam-policy-binding $svc \
          --region=$_REGION \
          --member=$_ALLOWED_USER \
          --role=roles/run.invoker \
          --quiet
      done

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
