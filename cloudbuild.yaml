# Cloud Build pipeline for AgentSchmidt with Cloud Deploy
# Triggers on push to main — deploys services with user-authenticated access.

substitutions:
  _REGION: 'europe-west1'

steps:
# 1. Ensure GCS bucket, sync config and prepare Pub/Sub topic
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'setup-infra-and-config'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      # 1. Bucket sicherstellen
      gcloud storage buckets describe gs://agentschmidt-hermes-data-$PROJECT_NUMBER >/dev/null 2>&1 || \
      gcloud storage buckets create gs://agentschmidt-hermes-data-$PROJECT_NUMBER \
        --project=$PROJECT_ID \
        --location=$_REGION

      # 2. Config per GitOps in den Bucket synchronisieren
      if [ -f "config/config.yaml" ]; then
        gcloud storage cp config/config.yaml gs://agentschmidt-hermes-data-$PROJECT_NUMBER/config.yaml
      fi

      # 3. Pub/Sub Topic vorbereiten
      gcloud pubsub topics describe agentschmidt-hermes-inbound >/dev/null 2>&1 || \
      gcloud pubsub topics create agentschmidt-hermes-inbound --project=$PROJECT_ID

# 2. Direct declarative deployment to Cloud Run via Knative YAML
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy-hermes'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run services replace services/hermes.yaml --region=$_REGION

