apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentschmidt-hermes
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: nousresearch/hermes-agent:latest
        args:
          - "sh"
          - "-c"
          - |
            mkdir -p /tmp/hermes
            if [ -f /opt/data/config.yaml ]; then
              cp /opt/data/config.yaml /tmp/hermes/config.yaml
            fi
            export HERMES_HOME=/tmp/hermes
            exec hermes gateway run
        ports:
        - containerPort: 8642
        resources:
          limits:
            cpu: 1000m
            memory: 2048Mi
        env:
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: '0.0.0.0'
        - name: API_SERVER_PORT
          value: '8642'
        - name: HERMES_LOG_DIR
          value: /tmp/hermes-logs
        - name: S6_LOGGING_SCRIPT
          value: 'n20 s1000000'
        - name: HERMES_UID
          value: '1000'
        - name: HERMES_GID
          value: '1000'
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: agentschmidt-hermes-api-server-key
              key: latest
        - name: GOOGLE_CLOUD_PROJECT
          value: 'project-ecf5ff03-f941-4f63-a23'
        - name: VERTEX_AI_PROJECT
          value: 'project-ecf5ff03-f941-4f63-a23'
        - name: VERTEX_AI_LOCATION
          value: 'europe-west1'
        - name: GOOGLE_CHAT_PROJECT_ID
          value: 'project-ecf5ff03-f941-4f63-a23'
        - name: GOOGLE_CHAT_SUBSCRIPTION_NAME
          value: 'projects/project-ecf5ff03-f941-4f63-a23/subscriptions/agentschmidt-hermes-inbound-sub'
        - name: GOOGLE_CHAT_ALLOWED_USERS
          value: 'sebastian.alxr@gmail.com'
        startupProbe:
          failureThreshold: 24
          periodSeconds: 10
          timeoutSeconds: 5
          tcpSocket:
            port: 8642
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      volumes:
      - name: hermes-data
        csi:
          driver: gcsfuse.run.googleapis.com
          readOnly: false
          volumeAttributes:
            bucketName: agentschmidt-hermes-data-309392925177
            mountOptions: implicit-dirs,uid=1000,gid=1000
